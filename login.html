<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar - Bando Map</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 15px;
        }

        .brand-text {
            color: #0d6efd;
            font-weight: 900;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .brand-text-registro {
            color: #198754;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- ========================================== -->
        <!-- CAIXA DE LOGIN -->
        <!-- ========================================== -->
        <div id="boxLogin">
            <div class="brand-text">O Bando Map</div>

            <form id="formLogin" onsubmit="fazerLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Seu Apelido</label>
                    <input type="text" class="form-control form-control-lg" id="loginApelido"
                        placeholder="Digite seu apelido" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Senha</label>
                    <input type="password" class="form-control form-control-lg" id="loginSenha" placeholder="******"
                        required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" id="btnEntrar">Entrar no
                    Mapa</button>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">Ainda não é do bando?</span>
                <a href="#" onclick="alternarTelas('registro')" class="fw-bold text-decoration-none">Registre-se
                    aqui</a>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- CAIXA DE REGISTRO -->
        <!-- ========================================== -->
        <div id="boxRegistro" style="display: none;">
            <div class="brand-text brand-text-registro">🌱 Novo Caçador</div>

            <form id="formRegistro" onsubmit="fazerRegistro(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Seu Apelido no Mapa</label>
                    <input type="text" class="form-control form-control-lg" id="regApelido"
                        placeholder="Ex: PirataUrbano" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Crie uma Senha</label>
                    <input type="password" class="form-control form-control-lg" id="regSenha" placeholder="******"
                        required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold" id="btnRegistrar">Criar Conta e
                    Entrar</button>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">Já é do bando?</span>
                <a href="#" onclick="alternarTelas('login')" class="fw-bold text-decoration-none text-success">Faça
                    login aqui</a>
            </div>
        </div>

    </div>

    <script>
        localStorage.clear();

        function alternarTelas(tela) {
            if (tela === 'registro') {
                document.getElementById('boxLogin').style.display = 'none';
                document.getElementById('boxRegistro').style.display = 'block';
            } else {
                document.getElementById('boxRegistro').style.display = 'none';
                document.getElementById('boxLogin').style.display = 'block';
            }
        }

        function fazerLogin(event) {
            event.preventDefault();

            const apelidoDigitado = document.getElementById('loginApelido').value.trim();
            const senhaDigitada = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btnEntrar');

            btn.innerHTML = 'Conectando...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('apelido', apelidoDigitado);
            formData.append('senha', senhaDigitada);

            fetch('auth/login.php', { method: 'POST', body: formData })
                .then(async res => {
                    // A MÁGICA DO ESPIÃO: Pega a resposta crua do servidor antes de converter
                    const textoCru = await res.text();
                    try {
                        return JSON.parse(textoCru); // Tenta converter para JSON
                    } catch (e) {
                        // Se falhar, mostra o erro real que o PHP cuspiu!
                        console.error("ERRO DO PHP:", textoCru);
                        alert("O servidor travou com este erro (veja o console F12): \n\n" + textoCru.substring(0, 150));
                        throw new Error("Falha ao ler JSON");
                    }
                })
                .then(data => {
                    if (data.sucesso) {
                        localStorage.setItem('bando_id', data.id);
                        localStorage.setItem('bando_apelido', data.apelido);
                        window.location.href = 'index.html';
                    } else {
                        alert("Atenção: " + data.erro);
                        btn.innerHTML = 'Entrar no Mapa';
                        btn.disabled = false;
                    }
                })
                .catch(erro => {
                    btn.innerHTML = 'Entrar no Mapa';
                    btn.disabled = false;
                });
        }

        function fazerRegistro(event) {
            event.preventDefault();

            const apelidoDigitado = document.getElementById('regApelido').value.trim();
            const senhaDigitada = document.getElementById('regSenha').value;
            const btn = document.getElementById('btnRegistrar');

            btn.innerHTML = 'Criando conta...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('apelido', apelidoDigitado);
            formData.append('senha', senhaDigitada);

            fetch('auth/registrar.php', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        localStorage.setItem('bando_id', data.id);
                        localStorage.setItem('bando_apelido', data.apelido);
                        window.location.href = 'index.html';
                    } else {
                        alert("Atenção: " + data.erro);
                        btn.innerHTML = 'Criar Conta e Entrar';
                        btn.disabled = false;
                    }
                })
                .catch(erro => {
                    alert("Erro ao conectar com o servidor.");
                    btn.innerHTML = 'Criar Conta e Entrar';
                    btn.disabled = false;
                });
        }
    </script>
</body>

</html>
