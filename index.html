<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para aplicativos móveis: impede que o usuário dê zoom acidental -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker Map</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Ícones do Bootstrap (para o ícone da câmera) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Reset básico e preparação para PWA */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f8f9fa;
        }

        /* O mapa ocupará toda a tela e ficará no fundo */
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* Botão flutuante (Floating Action Button) */
        .btn-flutuante {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            /* Fica acima do mapa */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .btn-flutuante:active {
            transform: scale(0.9);
        }

        /* Bordas arredondadas no modal para um visual mais moderno */
        .modal-content {
            border-radius: 15px;
        }

        /* Contêiner de visualização da foto tirada */
        #preview-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        #preview-foto {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- Contêiner do Mapa -->
    <div id="map"></div>

    <!-- Botão Flutuante que abre o formulário -->
    <button class="btn btn-primary btn-flutuante" data-bs-toggle="modal" data-bs-target="#modalUpload"
        aria-label="Adicionar Adesivo">
        <i class="bi bi-camera-fill"></i>
    </button>

    <!-- Modal do Formulário (Oculto por padrão) -->
    <div class="modal fade" id="modalUpload" tabindex="-1" aria-labelledby="modalUploadLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalUploadLabel">Registrar Novo Adesivo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="formAdesivo">

                        <!-- Input para câmera: capture="environment" abre a câmera traseira do celular -->
                        <div class="mb-3">
                            <label for="fotoInput" class="form-label">Tirar Foto do Adesivo</label>
                            <input class="form-control" type="file" accept="image/*" capture="environment"
                                id="fotoInput" required>
                        </div>

                        <!-- Preview da Imagem após tirar a foto -->
                        <div id="preview-container">
                            <img id="preview-foto" src="" alt="Preview do Adesivo">
                        </div>

                        <div class="mb-3 mt-3">
                            <label for="nomeLocal" class="form-label">Nome do Local</label>
                            <input type="text" class="form-control" id="nomeLocal" placeholder="Ex: Poste da Rua X..."
                                required>
                        </div>

                        <!-- Campos ocultos que guardarão as coordenadas do GPS -->
                        <input type="hidden" id="latInput">
                        <input type="hidden" id="lngInput">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <!-- O botão Salvar dispara a busca pelo GPS -->
                    <button type="button" class="btn btn-primary" id="btnSalvar">Capturar GPS e Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializa o Mapa
        const map = L.map('map').setView([-23.5505, -46.6333], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. Lógica para mostrar o preview da foto
        const fotoInput = document.getElementById('fotoInput');
        const previewContainer = document.getElementById('preview-container');
        const previewFoto = document.getElementById('preview-foto');

        fotoInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewFoto.src = e.target.result;
                    previewContainer.style.display = 'block';
                }
                reader.readAsDataURL(file); // Converte a imagem para mostrar na tela
            }
        });

        // 3. Lógica do botão Salvar: Captura o GPS e prepara o envio
        document.getElementById('btnSalvar').addEventListener('click', function () {
            if (!navigator.geolocation) {
                alert('Geolocalização não suportada pelo seu navegador.');
                return;
            }

            // Altera o estado do botão para indicar carregamento
            const btn = this;
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Obtendo GPS...';
            btn.disabled = true;

            // Solicita a localização do usuário
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    document.getElementById('latInput').value = lat;
                    document.getElementById('lngInput').value = lng;

                    alert(`Localização capturada: Lat ${lat}, Lng ${lng}\nAqui entra a lógica de enviar para o banco de dados!`);

                    // Reseta o estado do modal após o sucesso
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                    bootstrap.Modal.getInstance(document.getElementById('modalUpload')).hide();
                },
                function (error) {
                    alert('Erro ao obter localização. Verifique as permissões de GPS do seu celular.');
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                },
                { enableHighAccuracy: true } // Exige maior precisão (usa o chip de GPS do aparelho)
            );
        });
    </script>
</body>

</html>
