<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Admin - Bando Map</title>

    <!-- Bootstrap para deixar o visual incrível -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 900;
            color: #dc3545 !important;
        }

        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .table-responsive {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- Menu Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🛡️ Painel Admin do Bando</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light me-2">Voltar ao Mapa</a>
                <button onclick="sairDoApp()" class="btn btn-danger">Sair</button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container admin-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Gerenciamento de Caçadores</h3>
            <button class="btn btn-primary" onclick="carregarUsuarios()">Atualizar Lista</button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Apelido</th>
                        <th scope="col">Cargo</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <!-- Os usuários vão aparecer aqui gerados pelo JS -->
                    <tr>
                        <td colspan="4" class="text-center">Carregando usuários...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Quando a página abre, ele já tenta carregar a lista
        document.addEventListener("DOMContentLoaded", carregarUsuarios);

        // ==========================================
        // 1. CARREGAR USUÁRIOS
        // ==========================================
        function carregarUsuarios() {
            // Como não mandamos FormData, o PHP assume a ação 'listar'
            fetch('api/admin_usuarios.php')
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        renderizarTabela(data.dados);
                    } else {
                        alert("Bloqueado: " + data.erro);
                        // Se não for admin, chuta ele de volta pro mapa
                        if (data.erro.includes("negado")) window.location.href = 'index.html';
                    }
                })
                .catch(erro => {
                    console.error("Erro ao puxar lista:", erro);
                    document.getElementById('tabelaUsuarios').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro ao carregar dados.</td></tr>';
                });
        }

        // ==========================================
        // 2. DESENHAR TABELA
        // ==========================================
        function renderizarTabela(usuarios) {
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';

            // Pega o ID da pessoa logada para não deixar ela se excluir
            const meuId = localStorage.getItem('bando_id');

            usuarios.forEach(u => {
                const isMe = (u.id == meuId);

                // Design do cargo
                const badge = u.is_admin == 1
                    ? '<span class="badge bg-danger">Admin</span>'
                    : '<span class="badge bg-secondary">Caçador</span>';

                // Botões (Promover/Rebaixar e Excluir)
                let botoes = '';

                botoes += `<button class="btn btn-sm btn-info me-1 fw-bold text-white" onclick="resetarSenha(${u.id}, '${u.apelido}')">Resetar Senha</button>`;

                if (u.is_admin == 1) {
                    botoes += `<button class="btn btn-sm btn-warning me-1 fw-bold" onclick="executarAcao('rebaixar', ${u.id})" ${isMe ? 'disabled' : ''}>Rebaixar</button>`;
                } else {
                    botoes += `<button class="btn btn-sm btn-success me-1 fw-bold" onclick="executarAcao('promover', ${u.id})">Dar Admin</button>`;
                }



                botoes += `<button class="btn btn-sm btn-outline-danger fw-bold" onclick="executarAcao('excluir', ${u.id})" ${isMe ? 'disabled' : ''}>Excluir</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="text-muted fw-bold">#${u.id}</td>
                        <td class="fw-bold fs-5">${u.apelido} ${isMe ? '<span class="text-success fs-6">(Você)</span>' : ''}</td>
                        <td>${badge}</td>
                        <td class="text-end">${botoes}</td>
                    </tr>
                `;
            });
        }

        // ==========================================
        // 3. EXECUTAR AÇÕES (Promover, Rebaixar, Excluir)
        // ==========================================
        function executarAcao(acao, alvo_id) {
            // Travas de confirmação do Javascript
            if (acao === 'excluir' && !confirm("CUIDADO: Isso vai excluir o caçador permanentemente! Tem certeza?")) return;
            if (acao === 'rebaixar' && !confirm("Deseja remover os poderes de administrador deste usuário?")) return;

            const formData = new FormData();
            formData.append('acao', acao);
            formData.append('alvo_id', alvo_id);

            fetch('api/admin_usuarios.php', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        // Se deu certo, recarrega a tabela para ver a mudança
                        carregarUsuarios();
                    } else {
                        alert("Erro: " + data.erro);
                    }
                })
                .catch(erro => console.error(erro));


        }

        // ==========================================
        // 5. RESETAR SENHA DO USUÁRIO
        // ==========================================
        function resetarSenha(id, apelido) {
            // Abre uma caixinha perguntando qual será a nova senha temporária
            const novaSenha = prompt(`Digite a nova senha temporária para o caçador(a) ${apelido}:`);

            // Se você clicar em cancelar ou deixar vazio, ele aborta
            if (!novaSenha || novaSenha.trim() === '') return;

            const formData = new FormData();
            formData.append('acao', 'resetar_senha');
            formData.append('alvo_id', id);
            formData.append('nova_senha', novaSenha);

            fetch('api/admin_usuarios.php', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        alert(`Feito! A senha de ${apelido} agora é: ${novaSenha}`);
                    } else {
                        alert("Erro: " + data.erro);
                    }
                })
                .catch(erro => console.error(erro));
        }

        // ==========================================
        // 4. SAIR DO APP (BLINDADO)
        // ==========================================
        function sairDoApp() {
            // Mostra pro usuário que está saindo
            document.body.style.opacity = '0.5';

            fetch('api/logout.php')
                .finally(() => {
                    localStorage.clear();
                    window.location.href = 'login.html';
                });
        }

    </script>
</body>

</html>
